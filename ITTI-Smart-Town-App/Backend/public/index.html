<!DOCTYPE html>
<html>
<head>
  <title>ITTI Smart Town</title>

  <style>
    body {
      font-family: Arial;
      background: #f2f2f2;
      text-align: center;
      margin: 0;
    }

    h1 {
      background: black;
      color: white;
      padding: 15px;
      margin: 0;
    }

    .container {
      padding: 20px;
    }

    button {
      padding: 10px 15px;
      margin: 5px;
      border-radius: 6px;
      border: 1px solid black;
      background: white;
      cursor: pointer;
    }

    select {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid black;
    }

    .card {
      background: white;
      margin: 15px auto;
      padding: 15px;
      width: 320px;
      border-radius: 8px;
      border: 1px solid black;
      text-align: left;
    }

    .card h3 {
      margin: 0 0 5px 0;
    }

    .card p {
      margin: 4px 0;
    }

    #mapFrame {
      margin-top: 20px;
      border: 1px solid black;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<h1>ITTI Smart Town App</h1>

<div class="container">

  
  <div>
    <button onclick="filterCategory('all')">All</button>
    <button onclick="filterCategory('food')">Food</button>
    <button onclick="filterCategory('fitness')">Fitness</button>
    <button onclick="filterCategory('health')">Health</button>
  </div>

  <br>

  
  <h2 id="suggestion"></h2>
  <button onclick="getSmartSuggestion()">Get Recommendation</button>

  <br><br>

 
  <div>
    <select id="preference">
      <option value="food">Food</option>
      <option value="fitness">Fitness</option>
      <option value="health">Health</option>
    </select>
    <button onclick="savePreference()">Save Preference</button>
  </div>

  <br>

  
  <div id="places"></div>

  <!-- MAP -->
  <h2>Navigation Map</h2>
  <iframe 
    id="mapFrame"
    width="500"
    height="350">
  </iframe>

</div>

<script src="script.js"></script>

</body>
</html>
