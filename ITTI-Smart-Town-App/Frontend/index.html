<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>ITTI Smart Town App</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>ITTI Smart Town App</h1>
<p>Prototype focusing on town navigation for the municipality of Iitti.</p>

<div class="section">

  <h2>Town Navigation</h2>

  <p>
    This feature helps users find important locations such as shops,
    public services, and community places.
  </p>

  <h3>Available locations</h3>

  <!-- Search input -->
  <input type="text" id="search" placeholder="Search locations...">

  <ul id="places-list"></ul>

</div>

<script>

const list = document.getElementById("places-list");
const searchInput = document.getElementById("search");

let allPlaces = [];

// Show loading message
list.innerHTML = "<li>Loading locations...</li>";

// Function to display places
function displayPlaces(data) {
  list.innerHTML = "";

  data.forEach(place => {

    const item = document.createElement("li");
    const status = place.openNow ? "Open" : "Closed";

    item.innerHTML =
      "<strong>" + place.name + "</strong><br>" +
      "Category: " + place.category + "<br>" +
      "Days: " + place.days + "<br>" +
      "Hours: " + place.hours + "<br>" +
      "Status: " + status;

    list.appendChild(item);
  });
}

// Fetch data from backend
fetch("http://localhost:3000/places")
  .then(response => response.json())
  .then(data => {
    allPlaces = data;
    displayPlaces(allPlaces);
  })
  .catch(error => {
    console.error(error);
    list.innerHTML = "<li>Failed to load locations.</li>";
  });

// Search functionality
searchInput.addEventListener("input", () => {

  const value = searchInput.value.toLowerCase();

  const filtered = allPlaces.filter(place =>
    place.name.toLowerCase().includes(value)
  );

  displayPlaces(filtered);

});

</script>

</body>
</html>
