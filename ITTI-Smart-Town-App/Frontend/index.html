<!DOCTYPE html>
<html>
<head>
  <title>ITTI Smart Town</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>ITTI Smart Town App</h1>

<!-- CATEGORY FILTER -->
<div>
  <button onclick="filterCategory('all')">All</button>
  <button onclick="filterCategory('food')">Food</button>
  <button onclick="filterCategory('fitness')">Fitness</button>
  <button onclick="filterCategory('health')">Health</button>
</div>

<!-- SMART SUGGESTION -->
<h2 id="suggestion"></h2>
<button onclick="getSmartSuggestion()">Get Recommendation</button>

<!-- PERSONALIZATION -->
<div>
  <select id="preference">
    <option value="food">Food</option>
    <option value="fitness">Fitness</option>
    <option value="health">Health</option>
  </select>
  <button onclick="savePreference()">Save Preference</button>
</div>

<!-- PLACES -->
<div id="places"></div>

<script src="script.js"></script>
</body>
</html>
