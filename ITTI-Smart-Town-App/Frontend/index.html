<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ITTI Smart Town App Town Navigation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>ITTI Smart Town App</h1>
  <p>Prototype focusing on town navigation for the municipality of Iitti.</p>

  <div class="section">
    <h2>🗺️ Town Navigation</h2>
    <p>
      This feature helps users find important locations in Iitti such as shops,
      public services, and community places.
    </p>

    <p><strong>Available locations:</strong></p>
    <ul id="places-list">
      
    </ul>
  </div>

  <script>
    fetch("http://localhost:3000/places")
      .then(response => response.json())
      .then(data => {
        const list = document.getElementById("places-list");

        data.forEach(place => {
          const item = document.createElement("li");
          item.textContent = place.name + " (" + place.category + ")";
          list.appendChild(item);
        });
      })
      .catch(error => {
        console.error("Error loading town locations:", error);
      });
  </script>

</body>
</html>
